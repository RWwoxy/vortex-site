<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetim ve Kullanıcı Paneli</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0b10;
            --card-bg: rgba(18, 20, 29, 0.85);
            --primary-neon: #00f3ff;
            --secondary-neon: #ff007f;
            --admin-neon: #00ff66;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 243, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.05) 0%, transparent 40%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Neon Header */
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.2rem;
            color: #fff;
            text-shadow: 0 0 10px var(--primary-neon), 0 0 20px var(--primary-neon);
            margin-bottom: 10px;
        }

        /* Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Stats Cards */
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.2);
        }

        .stat-icon {
            font-size: 2.5rem;
            color: var(--primary-neon);
            text-shadow: 0 0 10px var(--primary-neon);
        }

        .stat-info h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-info p {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
        }

        /* Main Panels */
        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
        }

        .panel-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        /* Forms */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        .btn {
            background: linear-gradient(45deg, var(--primary-neon), #0088ff);
            color: #000;
            font-weight: bold;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        .btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
            transform: scale(1.02);
        }

        /* User Table */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            color: var(--primary-neon);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Badges & Neon Effects */
        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-neon);
            box-shadow: 0 0 8px var(--primary-neon);
        }

        .neon-admin {
            color: var(--admin-neon);
            font-weight: bold;
            text-shadow: 0 0 8px var(--admin-neon), 0 0 15px var(--admin-neon);
            animation: pulse 2s infinite alternate;
        }

        .badge-admin {
            background: rgba(0, 255, 102, 0.15);
            color: var(--admin-neon);
            border: 1px solid var(--admin-neon);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.3);
        }

        .badge-support {
            background: rgba(255, 0, 127, 0.15);
            color: var(--secondary-neon);
            border: 1px solid var(--secondary-neon);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-left: 5px;
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.3);
        }

        .badge-user {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #ff4757;
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.2s;
        }

        .action-btn:hover {
            color: #ff6b81;
        }

        /* Image Preview Box */
        .img-preview-container {
            margin-top: 10px;
            display: none;
        }

        .img-preview {
            max-width: 100px;
            max-height: 100px;
            border-radius: 8px;
            border: 1px solid var(--primary-neon);
        }

        @keyframes pulse {
            from { text-shadow: 0 0 5px var(--admin-neon); }
            to { text-shadow: 0 0 15px var(--admin-neon), 0 0 25px var(--admin-neon); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fa-solid fa-shield-halved"></i> KULLANICI & YÖNETİM PANELİ</h1>
    </header>

    <!-- Stat Kartları -->
    <div class="dashboard-grid">
        <div class="stat-card">
            <i class="fa-solid fa-users stat-icon"></i>
            <div class="stat-info">
                <h3>Toplu Kayıtlı Kullanıcı</h3>
                <p id="stat-total-users">0</p>
            </div>
        </div>
        <div class="stat-card">
            <i class="fa-solid fa-user-shield stat-icon" style="color: var(--admin-neon);"></i>
            <div class="stat-info">
                <h3>Yöneticiler</h3>
                <p id="stat-admins">0</p>
            </div>
        </div>
        <div class="stat-card">
            <i class="fa-solid fa-headset stat-icon" style="color: var(--secondary-neon);"></i>
            <div class="stat-info">
                <h3>Destek Ekibi</h3>
                <p id="stat-support">0</p>
            </div>
        </div>
    </div>

    <!-- Yeni Kullanıcı / Resim Bağlantısı Ekleme Formu -->
    <div class="panel">
        <h2 class="panel-title"><i class="fa-solid fa-user-plus"></i> Yeni Kullanıcı & Profil Resmi Ekle</h2>
        <form id="addUserForm">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="username" placeholder="Örn: Player1" required>
                </div>
                <div class="form-group">
                    <label>E-Posta Adresi</label>
                    <input type="email" id="email" placeholder="ornek@mail.com" required>
                </div>
                <div class="form-group">
                    <label>Profil Resim Linki (URL)</label>
                    <input type="url" id="avatarUrl" placeholder="https://resim-linki.com/gorsel.jpg" oninput="previewImage(this.value)">
                </div>
                <div class="form-group">
                    <label>Rol Seçimi</label>
                    <select id="role">
                        <option value="User">Standart Kullanıcı</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
            </div>

            <!-- Resim Önizleme -->
            <div class="img-preview-container" id="previewBox">
                <label>Resim Önizleme:</label>
                <img id="imgPreview" src="" class="img-preview" alt="Önizleme" onerror="this.src='https://via.placeholder.com/100?text=Geçersiz+Link'">
            </div>

            <button type="submit" class="btn" style="margin-top: 15px;"><i class="fa-solid fa-plus"></i> Kullanıcıyı Kaydet</button>
        </form>
    </div>

    <!-- Kayıtlı Kullanıcılar Tablosu -->
    <div class="panel">
        <h2 class="panel-title"><i class="fa-solid fa-list"></i> Kayıtlı Kullanıcı Paneli</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Profil</th>
                        <th>Kullanıcı Adı</th>
                        <th>E-Posta</th>
                        <th>Yetkiler & Rozetler</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Dinamik Yüklenecek -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Varsayılan / Sabit Sistem Kullanıcıları
    const defaultUsers = [
        {
            id: '1',
            username: 'NirvanaX',
            email: 'sancaktaraydin66@gmail.com',
            avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150',
            isAdmin: true,
            isSupport: true
        },
        {
            id: '2',
            username: 'ShadowX',
            email: 'kadirrr13aydin@gmail.com',
            avatar: 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=150',
            isAdmin: true,
            isSupport: true
        }
    ];

    // Veri Tabanı (LocalStorage Senkronizasyonu)
    function getUsers() {
        const stored = localStorage.getItem('system_users_db');
        if (!stored) {
            localStorage.setItem('system_users_db', JSON.stringify(defaultUsers));
            return defaultUsers;
        }
        return JSON.parse(stored);
    }

    function saveUsers(users) {
        localStorage.setItem('system_users_db', JSON.stringify(users));
        render(); // Veri değiştiğinde paneli anında güncelle
    }

    // Resim Önizleme Fonksiyonu
    function previewImage(url) {
        const box = document.getElementById('previewBox');
        const img = document.getElementById('imgPreview');
        if (url.trim() !== '') {
            img.src = url;
            box.style.display = 'block';
        } else {
            box.style.display = 'none';
        }
    }

    // Yeni Kullanıcı Ekleme
    document.getElementById('addUserForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        let avatar = document.getElementById('avatarUrl').value.trim();
        const role = document.getElementById('role').value;

        // Varsayılan resim
        if (!avatar) {
            avatar = 'https://api.dicebear.com/7.x/bottts/svg?seed=' + encodeURIComponent(username);
        }

        const users = getUsers();
        const newUser = {
            id: Date.now().toString(),
            username: username,
            email: email,
            avatar: avatar,
            isAdmin: role === 'Admin',
            isSupport: false
        };

        users.push(newUser);
        saveUsers(users);

        // Formu Sıfırla
        this.reset();
        document.getElementById('previewBox').style.display = 'none';
    });

    // Kullanıcı Silme
    function deleteUser(id) {
        let users = getUsers();
        users = users.filter(u => u.id !== id);
        saveUsers(users);
    }

    // Arayüz ve İstatistik Güncelleme (Merkezi Fonksiyon)
    function render() {
        const users = getUsers();
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';

        let adminCount = 0;
        let supportCount = 0;

        users.forEach(user => {
            if (user.isAdmin) adminCount++;
            if (user.isSupport) supportCount++;

            const tr = document.createElement('tr');
            
            // Neon İsim Mantığı (Adminler için)
            const nameHTML = user.isAdmin 
                ? `<span class="neon-admin">${user.username}</span>` 
                : `<span>${user.username}</span>`;

            // Rozetler
            let badges = '';
            if (user.isAdmin) badges += `<span class="badge-admin"><i class="fa-solid fa-crown"></i> Admin</span>`;
            if (user.isSupport) badges += `<span class="badge-support"><i class="fa-solid fa-headset"></i> Destek</span>`;
            if (!user.isAdmin && !user.isSupport) badges += `<span class="badge-user">Kullanıcı</span>`;

            // Silme Butonu (Ana adminler korunur)
            const isMainAdmin = user.email === 'sancaktaraydin66@gmail.com' || user.email === 'kadirrr13aydin@gmail.com';
            const actionHTML = isMainAdmin 
                ? `<i class="fa-solid fa-lock" style="color: var(--text-muted);" title="Sistem Yöneticisi Silinemez"></i>` 
                : `<button class="action-btn" onclick="deleteUser('${user.id}')" title="Kullanıcıyı Sil"><i class="fa-solid fa-trash"></i></button>`;

            tr.innerHTML = `
                <td>
                    <img src="${user.avatar}" class="user-avatar" alt="Avatar" onerror="this.src='https://via.placeholder.com/45?text=User'">
                </td>
                <td>${nameHTML}</td>
                <td style="color: var(--text-muted);">${user.email}</td>
                <td>${badges}</td>
                <td>${actionHTML}</td>
            `;

            tbody.appendChild(tr);
        });

        // Sayısal İstatistiklerin Hatalarını Düzelterek Güncelleme
        document.getElementById('stat-total-users').innerText = users.length;
        document.getElementById('stat-admins').innerText = adminCount;
        document.getElementById('stat-support').innerText = supportCount;
    }

    // Sayfa Yüklendiğinde Çalıştır
    document.addEventListener('DOMContentLoaded', render);
</script>

</body>
</html>
